%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/renesas/renesas,rcar-gen5-mfis.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas MFIS (Multifunctional Interface) controller

maintainers:
  - Kuninori Morimoto <kuninori.morimoto.gx@renesas.com>

description:
  Renesas multifunctional interface (MFIS) provides an interface between
  the different CPU Cores, such as AP System Core domain and the Realtime
  Core domain, SCP Core domain and AP System Core domain or Realtime Core
  domain and AP System Core domain or Realtime Core domain.
  The MFIS supports the issuing of interrupts for each CPU core domain.

properties:
  compatible:
    anyOf:
      # for MFIS-SCP
      - items:
          - enum:
              - renesas,r8a78000-mfis-scp
          - const: renesas,rcar-gen5-mfis-scp
      # for MFIS
      - items:
          - enum:
              - renesas,r8a78000-mfis
          - const: renesas,rcar-gen5-mfis

  reg-names:
    items:
      - const: common
      - const: mboxes

  reg:
    maxItems: 2

  "#mbox-cells":
    const: 3

required:
  - compatible
  - "#mbox-cells"

additionalProperties: false

examples:
  - |
    /*
     * Sample for MFIS
     */
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    syscon@189e0000  {
        compatible = "renesas,r8a78000-mfis",
                     "renesas,rcar-gen5-mfis";
        status = "okay";
        reg = <0x189e0000 0x1000>, <0x18800000 0x40000>;
        reg-names = "common", "mboxes";
        #mbox-cells = <3>;
    };
